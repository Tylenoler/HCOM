[package]
name = "hcom-core"
version = "0.2.0"
edition = "2021"
description = "HCOM serial and protocol core"

[[bin]]
name = "hcom-core"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4.8"
